services:
  - type: web
    name: compliance-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://compliance-web.onrender.com

  - type: web
    name: compliance-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://compliance-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
